name: AI service tests

on:
  push:
    branches:
      - main
      - "ai/**"
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service-tests.yml"
  pull_request:
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run test suite
        run: pytest -q
      - name: Generate labelled synthetic employee history
        run: python scripts/generate_synthetic_employee_history.py
      - name: Execute and validate the sample-data attrition dataset
        run: python scripts/validate_attrition_dataset.py --horizon-days 90 --report-json artifacts/attrition_dataset_validation.json
